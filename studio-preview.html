ative-workspace .workspace{grid-template-columns:minmax(0,1fr) 290px}.native-workspace.resources-open .workspace{grid-template-columns:170px minmax(0,1fr) 290px}.wordmark{font-size:12px}.project-name{padding-left:10px}.app-header{gap:10px}}@media(max-width:800px){.workspace,.native-workspace .workspace{grid-template-columns:minmax(0,1fr) 260px}.native-workspace.resources-open .workspace{grid-template-columns:160px minmax(0,1fr) 260px}.native-workspace #full-editor-status{display:none}.workspace-tabs [data-workspace]{padding:0 9px}.workspace-tabs #boards-toggle{padding:5px}.header-actions button{font-size:11px}}

function apply(p,ops){p=clone(p);if(!ops.length||ops.length>24)throw Error('Use 1–24 editing operations');for(const o of ops){if(o.op==='add_frame'){const f=template(o.template_id);if(o.new_id)f.id=o.new_id;p.frames.push(f);p.active_frame=f.id;continue}if(o.op==='select_frame'){if(!p.frames.some(f=>f.id===o.frame_id))throw Error('Unknown artboard');p.active_frame=o.frame_id;continue}if(o.op==='remove_frame'){if(p.frames.length<2)throw Error('Keep one artboard');p.frames=p.frames.filter(f=>f.id!==o.frame_id);p.active_frame=p.frames[0].id;continue}if(o.op==='graphics_result'){const current=getFrame(p);if(current.kind==='graphics'&&current.document.engine===o.document.engine&&!o.append)current.document=clone(o.document);else{const f={id:o.new_id,kind:'graphics',document:clone(o.document),stage:'colour',show_labels:false,detail:1,hidden_layers:[],geometry_locked:true,artwork_media_id:null};p.frames.push(f);p.active_frame=f.id;}continue}if(o.op==='project_title'){p.title=o.value;continue}if(o.op==='brief'){p.brief=o.value;continue}const f=p.frames.find(f=>f.id===(o.frame_id||p.active_frame));if(!f)throw Error('Unknown artboard');const d=f.document;switch(o.op){case 'title':case 'subtitle':case 'caption':case 'description':d[o.op]=o.value;break;case 'stage':f.stage=o.value;break;case 'show_labels':f.show_labels=o.value;break;case 'detail':f.detail=o.value;break;case 'geometry_lock':f.geometry_locked=o.value;break;case 'label_size':if(f.kind!=='plate')throw Error('Use an atlas plate');d.label_size=o.value;break;case 'art_box':d.art_box=o.value;break;case 'label':{const l=d.labels.find(l=>l.landmark===o.landmark);if(!l)throw Error('Unknown label');const allowed=['text','side','y','target','target_note'];if(Object.keys(o.values).some(k=>!allowed.includes(k)))throw Error('Unknown label property');Object.assign(l,o.values);break}case 'layer':if(!o.layer_id.startsWith('texture-')&&f.geometry_locked)throw Error('Geometry is locked');f.hidden_layers=f.hidden_layers.filter(x=>x!== function localPlan(prompt,p){const ops=[];for(const text of prompt.split(';').map(s=>s.trim()).filter(Boolean)){const q=text.toLowerCase();let m;if(['show contours','contours','line drawing'].includes(q))ops.push({op:'stage',value:'contours'});else if(['show values','values','grayscale','greyscale'].includes(q))ops.push({op:'stage',value:'values'});else if(['show colour','show color','colour','color','restore colour'].includes(q))ops.push({op:'stage',value:'colour'});else if(['hide labels','artwork only'].includes(q))ops.push({op:'show_labels',value:false});else if(['show labels','restore labels'].includes(q))ops.push({op:'show_labels',value:true});else if(['less texture','reduce texture','simplify texture'].includes(q))ops.push({op:'detail',value:.45});else if(['restore texture','full texture'].includes(q))ops.push({op:'detail',value:1});else if(m=q.match(/^(?:set )?labels? (?:size )?(\d+(?:\.\d+)?)$/))ops.push({op:'label_size',value:+m[1]});else if(m=text.match(/^(?:set )?(title|subtitle|caption)\s*:\s*(.+)$/i))ops.push({op:m[1].toLowerCase(),value:m[2]});else if(m=q.match(/^add (atlas-[a-z-]+)$/))ops.push({op:'add_frame',template_id:m[1]});else if(m=text.match(/^rename ([a-z0-9-]+)\s*:\s*(.+)$/))ops.push({op:'label',landmark:m[1],values:{text:m[2]}});else if(m=q.match(/^move ([a-z0-9-]+) (left|right) (\d+(?:\.\d+)?)$/))ops.push({op:'label',landmark:m[1],values:{side:m[2],y:+m[3]}});else throw Error('Local commands: show contours; show colour; hide labels; labels 18; less texture; title: ...; rename cortex: ...; move cortex left 330. Free-form interpretation requires the server and a configured model.')}for(const o of ops)if(['add_frame','add_node'].includes(o.op))o.new_id=uid(o.op==='add_frame'?'frame':'node');apply(p,ops);return {summary:prompt,operations:ops,provider:'Local commands (no model)',warnings:[]}}
async function offlineRequest(path,options={}){const method=options.method||'GET',b=options.body?JSON.parse(options.body):{},db=readDB();const parts=path.split('?')[0].split('/').filter(Boolean),params=new URLSearchParams(path.split('?')[1]||'');const pid=parts[2];if(path==='/api/session')return {token:'offline',mode:'standalone',version:'2.1.0',providers:{local:true,ollama:false,figurelabs:false}};if(path==='/api/bootstrap')return JSON.parse(embedded.textContent);if(parts[1]==='projects'&&parts.length===2){if(method==='POST'){const p=newProject(b.title||'Untitled illustration',b.template_id||'atlas-kidney-section');db.projects[p.id]={project:p,version:1};db.history[p.id]=[{project:clone(p),version:1,reason:'Created project',created:new Date().toISOString()}];saveDB(db);return db.projects[p.id]}return Object.values(db.projects).map(v=>({id:v.project.id,title:v.project.title,version:v.version}))}if(path==='/api/import'){const p=clone(b.project);checkProject(p);if(p.frames.some(f=>f.artwork_media_id)||p.references.some(r=>r.media_id))throw Error('This JSON needs its media; restore from the server bundle');p.id=uid('project');db.projects[p.id]={project:p,version:1};db.history[p.id]=[{project:clone(p),version:1,reason:'Imported project',created:new Date().toISOString()}];saveDB(db);return db.projects[p.id]}const snap=db.projects[pid];if(!snap)throw Error('Project not found');function commit(p,reason){if(b.base_version!==undefined&&b.base_version!==snap.version)throw Error('Project changed; reload before applying this edit');snap.project=p;snap.version++;db.history[pid].push({project:clone(p),version:snap.version,reason,created:new Date().toISOString()});saveDB(db);return clone(snap)}if(parts.length===3){if(params.has('version')){const h=db.history[pid].find(h=>h.version===+params.get('version'));if(!h)throw Error('Unknown revision');return {project:clone(h.project),version:h.version}}return clone(snap)}switch(parts[3]){case 'edit':return commit(apply(snap.project,b.oper async function request(path,options={},retry=true){if(offline)return offlineRequest(path,options);const r=await fetch(path,{...options,headers:{'Content-Type':'application/json','X-Studio-Token':state.session?.token||'',...(options.headers||{})}});if(r.status===403&&retry){const problem=await r.clone().json().catch(()=>({}));if(String(problem.error||'').includes('session token')){state.session=await request('/api/session',{},false);return request(path,options,false)}}if(!r.ok){let m;try{const j=await r.json();m=j.error||j.detail}catch(e){m=r.statusText}throw Error(typeof m==='string'?m:JSON.stringify(m))}return r.json()}

async function loadMedia(){for(const r of state.project.references){if(r.media_id)await mediaURL(r.media_id)}for(const f of state.project.frames){if(f.artwork_media_id)await mediaURL(f.artwork_media_id);if(f.kind==='graphics')await mediaURL(f.document.preview_media_id)}}
async function mediaURL(mid){if(state.media.has(mid))return state.media.get(mid);let uri;if(offline){const m=readDB().media[mid];if(!m)return '';uri='data:'+m.mime+';base64,'+m.data}else{const r=await fetch('/api/projects/'+state.project.id+'/media/'+mid);if(!r.ok)return '';const blob=await r.blob();uri=await new Promise(res=>{const rd=new FileReader();rd.onload=()=>res(rd.result);rd.readAsDataURL(blob)})}state.media.set(mid,uri);return uri}

function normalizeSVG(a,frame,prefix){const root=svgDoc(a.svg);for(const n of [...root.querySelectorAll('[id]')])if(frame.hidden_layers?.includes(n.id))n.remove();for(const n of root.querySelectorAll('[id]')){if(n.id.startsWith('texture-')){if(frame.stage==='contours'){n.remove();continue}n.setAttribute('opacity',+(n.getAttribute('opacity')||1)*frame.detail)}}for(const n of [root,...root.querySelectorAll('*')]){for(const attr of [...n.attributes]){if(attr.name==='id')n.setAttribute('id',prefix+attr.value);else if(attr.value.includes('url(#'))n.setAttribute(attr.name,attr.value.replace(/url\(#([\w.-]+)\)/g,(_,id)=>'url(#'+prefix+id+')'));}if(frame.stage==='values')for(const attr of [...n.attributes])n.setAttribute(attr.name,attr.value.replace(/#[0-9a-fA-F]{6}\b/g,c=>{const g=Math.round(.2126*parseInt(c.slice(1,3),16)+.7152*parseInt(c.slice(3,5),16)+.0722*parseInt(c.slice(5,7),16)).toString(16).padStart(2,'0');return '#'+g+g+g}));if(frame.stage==='contours'&&['path','ellipse','circle','polygon','polyline','rect'].includes(n.localName)){n.setAttribute('fill','none');n.setAttribute('stroke','#74695f');n.setAttribute('stroke-width','.9');n.setAttribute('opacity','.65')}}root.querySelectorAll(':scope > title,:scope > desc').forEach(n=>n.remove());return [...root.children].map(n=>new XMLSerializer().serializeToString(n)).join('')}

const metrics=document.createElement('canvas').getContext('2d');

function renderSVG(frame){const d=frame.document;if(frame.kind==='graphics')return `<svg xmlns="${NS}" viewBox="0 0 ${d.width} ${d.height}" width="190mm" height="${190*d.height/d.width}mm"><title>${escape(d.title)}</title><image width="${d.width}" height="${d.height}" href="${state.media.get(d.preview_media_id)||''}"/></svg>`;if(frame.kind==='scene')return renderScene(frame);const a=state.assets[d.asset],w=d.width,h=d.height,fs=d.label_size;let art=assetEmbed(a,d.art_box,frame);if(frame.artwork_media_id){const src=state.media.get(frame.artwork_media_id);if(src){const [x,y,bw,bh]=d.art_box;art=`<g id="node-anatomy"><image x="${x}" y="${y}" width="${bw}" height="${bh}" preserveAspectRatio="xMidYMid meet" href="${src}"/></g>`}}let svg=`<svg xmlns="${NS}" viewBox="0 0 ${w} ${h}" width="${d.print_width_mm}mm" height="${d.print_width_mm*h/w}mm" role="img" aria-labelledby="plate-title plate-desc"><title id="plate-title">${escape(d.title)}</title><desc id="plate-desc">${escape(d.description)}</desc><rect width="${w}" height="${h}" fill="#fff"/>${svgText(d.title,42,23,w-84,30,'#292620','Georgia, serif')}${svgText(d.subtitle,42,67,w-84,15,'#69645e')}${art}`;if(frame.show_labels){svg+='<g id="plate-labels">';for(const r of labelRows(d,a)){const [tx,ty]=r.target,cy=r.y+r.height/2;let sx,ex;if(r.side==='left'){const tw=Math.max(...r.lines.map(l=>textWidth(l,fs)));sx=r.x+tw+7;ex=Math.max(sx+8,Math.min(tx-15,r.x+r.width+22))}else{sx=r.x-8;ex=Math.min(sx-8,Math.max(tx+15,r.x-25))}svg+=`<g id="plate-label-${escape(r.label.landmark)}"><path d="M${sx} ${cy} L${ex} ${cy} L${tx} ${ty}" stroke="#665e57" stroke-width=".85" fill="none"/><circle cx="${tx}" cy="${ty}" r="1.6" fill="#665e57"/>${svgText(r.label.text,r.x,r.y-fs*.12,r.width,fs)}</g>`}svg+='</g>'}svg+=svgText(d.caption,42,h-115,w-84,14,'#625b53')+svgText(d.reference_line,42,h-47,w-84,11,'#7a7269')+'</svg>';return svg}
function renderScene(f){if(offline){const t=state.data.templates.find(t=>t.id===f.template_id||t.id===f.document.id);return t?.svg||'';}const t=state.data.templates.find(t=>t.id===f.template_id||t.id===f.document.id);if(!t?.svg)return `<svg xmlns="${NS}" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="white"/></svg>`;const root=svgDoc(t.svg),d=f.document;const title=root.querySelector('#figure-title');if(title)title.textContent=d.title;const desc=root.querySelector('#figure-description');if(desc)desc.textContent=d.description;const texts=[...root.children].filter(n=>n.localName==='text');if(texts[0]){texts[0].textContent=d.title}if(texts.length>1&&t.document.subtitle)texts[1].textContent=d.subtitle;for(const n of d.nodes){const a=state.assets[n.asset];if(!a||!n.box)continue;const old=root.querySelector('[id="node-'+n.id+'"]');const box=n.box,sc=Math.min(box[2]/a.view_box[2],box[3]/a.view_box[3]),rot=n.rotation||0;const g=svgDoc(`<svg xmlns="${NS}">${assetEmbed(a,box,{...f,stage:'colour'},n.id)}</svg>`).firstElementChild;if(old)old.replaceWith(g);else root.append(g);if(rot)g.setAttribute('transform',g.getAttribute('transform').replace(' scale(',` rotate(${rot}) scale(`))}return new XMLSerializer().serializeToString(root)}

function renderCanvas(){const requestId=++renderCanvas.requestId|| (renderCanvas.requestId=1);const f=getFrame();$('#paper').innerHTML=renderSVG(f);const [w,h,mm]=dims(f);$('#canvas-wrap').style.width=w*state.zoom+'px';$('#canvas-wrap').style.height=h*state.zoom+'px';$('#zoom-label').textContent=Math.round(state.zoom*100)+'%';$('#canvas-description').textContent=f.kind==='plate'?f.document.anatomy.view+' · Not to scale':f.kind==='graphics'?(f.document.engine==='vector'?'Vector artwork':'Pixel artwork'):'Schematic · Not to scale';$('#canvas-dimensions').textContent=mm+' mm · '+(f.kind==='graphics'?(f.document.engine==='vector'?'Editable vectors':'Layered image'):f.artwork_media_id?'Hybrid artwork':'Editable SVG');$$('[data-stage]').forEach(b=>{b.classList.toggle('active',b.dataset.stage===f.stage);b.disabled=f.kind!=='plate'||(!!f.artwork_media_id&&b.dataset.stage!=='colour')});$('#labels-visible').checked=f.show_labels;$('#labels-visible').disabled=f.kind==='graphics';$('#preview-banner').hidden=!state.preview;$('#preview-text').textContent=state.previewVersion?'Revision '+state.previewVersion+' · read only':'Proposed revision · not yet applied';if(state.selected){const el=$('#paper [id="plate-label-'+state.selected+'"]');if(el)el.classList.add('selected')}showRegion();bindCanvas();if(!offline){let url=`/api/projects/${state.project.id}/render?frame_id=${f.id}`;if(state.previewVersion)url+='&version='+state.previewVersion;else if(state.preview&&state.proposal)url+='&proposal_id='+state.proposal.id;fetch(url).then(async r=>{if(!r.ok)throw Error('Cannot render the current revision');return r.text()}).then(svg=>{if(requestId===renderCanvas.requestId){$('#paper').innerHTML=svg;bindCanvas();}}).catch(e=>toast(e.message,true));}}

async function init(){state.session=await request('/api/session');$('#graphics-open').onclick=graphicsDialog;$('#boards-toggle').onclick=()=>{const open=document.body.classList.toggle('resources-open');$('#boards-toggle').setAttribute('aria-expanded',open);$('#boards-toggle').textContent=open?'Hide artboards':'Artboards'};$$('[data-workspace]').forEach(b=>{b.disabled=offline&&b.dataset.workspace!=='canvas';b.onclick=()=>guarded(()=>switchWorkspace(b.dataset.workspace))});$('#editor-discard-switch').onclick=()=>guarded(async()=>{const next=state.pendingEngine;state.pendingEngine=null;state.editorSession=null;await fullEditor(next)});$('#artwork-import').onclick=artworkImportDialog;state.model=state.session.providers.codex?'codex':'local';state.data=await request('/api/bootstrap');state.assets=Object.fromEntries(state.data.assets.map(a=>[a.id,a]));let ps=await request('/api/projects');if(!ps.length){const r=await post('/api/projects',{title:'Renal anatomy',template_id:'atlas-kidney-section'});ps=[{id:r.project.id}]}$$('[data-left]').forEach(b=>b.onclick=()=>{state.left=b.dataset.left;renderLeft()});$$('[data-right]').forEach(b=>b.onclick=()=>{state.right=b.dataset.right;renderRight()});$$('[data-stage]').forEach(b=>b.onclick=()=>guarded(()=>edit([{op:'stage',value:b.dataset.stage}],'Changed drawing stage')));$('#labels-visible').onchange=e=>guarded(()=>edit([{op:'show_labels',value:e.target.checked}],'Changed label visibility'));$('#fit-canvas').onclick=fit;$('#zoom-in').onclick=()=>zoom(1.2);$('#zoom-out').onclick=()=>zoom(1/1.2);$('#select-tool').onclick=()=>{state.tool='select';$('#select-tool').classList.add('active');$('#region-tool').classList.remove('active')};$('#region-tool').onclick=()=>{state.tool='region';$('#region-tool').classList.add('active');$('#select-tool').classList.remove('active')};$('#close-preview').onclick=()=>{state.preview=null;state.previewVersion=null;renderCanvas()};$('#export-open').onclick=exportDialog;$('#history-open').onclick=()=>guarded(historyDialog);$('#project-picker').onclick=()=>guarded(projectsDialog);$('#new-project').onclick=newProjectDialog;$('#modal-close').onclick=()=>$('#modal').close();$('#modal').addEventListener('close',()=>{$('#modal-content').innerHTML=''});$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').close()};$('#import-project').onclick=()=>$('#project-file').click();$('#project-file').onchange=e=>guarded(async()=>{const f=e.target.files[0];if(!f)return;if(f.name.endsWith('.zip')){if(offline)throw Error('Use the local server to import a media bundle');const data=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.readAsDataURL(f)});const r=await post('/api/import-bundle',{data});await loadProject(r.project.id)}else{const p=JSON.parse(await f.text());const r=await post('/api/import',{project:p});await loadProject(r.project.id)}e.target.value=''});window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key.toLowerCase()==='v')$('#select-tool').click();if(e.key.toLowerCase()==='r')$('#region-tool').click();if(e.key==='0')fit();if(e.key==='Escape'){state.preview=null;state.previewVersion=null;state.region=null;renderCanvas()}});window.addEventListener('resize',()=>{clearTimeout(init.resize);init.resize=setTimeout(fit,150)});await loadProject(ps[0].id);if(offline)toast('Standalone workspace. Edits are saved in this browser.');}
guarded(init);
})();
