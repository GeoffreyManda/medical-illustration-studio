<path d="M885 408 L659.46 412" fill="none" stroke="#61727B" stroke-width="1.05" stroke-linejoin="round"/><circle cx="659.46" cy="412" r="2.25" fill="#61727B"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#354753" font-weight="normal"><tspan x="890" y="398">Tunica media</tspan></text>
<path d="M885 549 L857 519 L711.06 412" fill="none" stroke="#61727B" stroke-width="1.05" stroke-linejoin="round"/><circle cx="711.06" cy="412" r="2.25" fill="#61727B"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#354753" font-weight="normal"><tspan x="890" y="557">Tunica externa</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#354753" font-weight="bold"><tspan x="67" y="659">TRANSVERSE VIEW</tspan></text>
<path d="M50 700 H1150" fill="none" stroke="#CCD4D5" stroke-width="1"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#354753" font-weight="normal"><tspan x="50" y="734">Schematic; not to scale. Layer widths are explanatory, not measured. The outer layer is the tunica externa (adventitia).</tspan><tspan x="50" y="756.44">Reference: OpenStax, A&amp;P 2e, section 20.1.</tspan></text>
</svg>
