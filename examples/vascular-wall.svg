/><ellipse cx="65.5" cy="24.88526329025128" rx="4" ry="1.2" fill="#9D7069" stroke="none" stroke-width="1.3" transform="rotate(390 65.5 24.88526329025128)" /><ellipse cx="76.8467875173176" cy="35.499999999999986" rx="4" ry="1.2" fill="#9D7069" stroke="none" stroke-width="1.3" transform="rotate(420 76.8467875173176 35.499999999999986)" /></g>
