<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="120mm" viewBox="0 0 1200 800" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Selective detail inside a cell</title>
<desc id="figure-description">A generic nucleated cell is shown with a nucleus, mitochondria, rough endoplasmic reticulum, Golgi apparatus and a lysosome. Organelles are contained within the cell outline. Their numbers and relative dimensions are chosen for explanation rather than representing a measured cell.</desc>
