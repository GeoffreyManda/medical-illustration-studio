<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="120mm" viewBox="0 0 1200 800" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">From a specimen to an interpretable image</title>
<desc id="figure-description">A conceptual research workflow progresses from a labelled sample vial to a prepared microscope slide, then to optical microscopy. The arrows indicate the order of activities, not a biological mechanism. No sample results, operating instructions, measurements or patient identifiers are shown.</desc>
<rect width="1200" height="800" fill="#FFFFFF"/>
<defs><marker id="arrow-flow" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 -4 L9 0 L0 4 Z" fill="#354753"/></marker><marker id="arrow-activation" viewBox="0 -6 11 12" refX="10" refY="0" markerWidth="11" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 -5 L10 0 L1 5" fill="none" stroke="#354753" stroke-width="1.8"/></marker><marker id="arrow-inhibition" viewBox="-2 -8 5 16" refX="0" refY="0" markerWidth="5" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 -7 L0 7" stroke="#354753" stroke-width="2.2"/></marker></defs>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="34" text-anchor="start" fill="#354753" font-weight="bold"><tspan x="50" y="65">From a specimen to an interpretable image</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#354753" font-weight="normal"><tspan x="50" y="100">A descriptive workflow, without fabricated experimental results</tspan></text>
<g id="node-sample" transform="translate(235 372.5) rotate(0) scale(1.8 1.8) translate(-50 -50)"><rect x="27" y="18" width="47" height="72" rx="9" fill="#EEF2F3" stroke="#8298A2" stroke-width="1.3" /><rect x="24" y="10" width="53" height="17" rx="3" fill="#BBCFD7" stroke="#8298A2" stroke-width="1.3" /><rect x="32" y="51" width="37" height="29" rx="3" fill="#DDE9E7" stroke="none" stroke-width="0" /><rect x="33" y="33" width="35" height="20" rx="1" fill="#FFFFFF" stroke="#B5C3C8" stroke-width="0.7" /></g>
<g id="node-slide" transform="translate(600.5 373.5) rotate(0) scale(1.73 1.73) translate(-50 -50)"><rect x="6" y="29" width="88" height="45" rx="2" fill="#F0F4F4" stroke="#8B9DA3" stroke-width="1.5" /><rect x="9" y="32" width="18" height="39" rx="0" fill="#DDE5E8" stroke="none" stroke-width="1.3" /><rect x="47" y="35" width="32" height="32" rx="0" fill="none" stroke="#AEBBC0" stroke-width="1" /><ellipse cx="61" cy="52" rx="9" ry="7" fill="#B9CDD0" stroke="#86A5AE" stroke-width="1" /></g>
<g id="node-scope" transform="translate(974 366.5) rotate(0) scale(1.96 1.96) translate(-50 -50)"><path d="M44 23 Q78 19 79 56 L70 75 L85 85 L84 92 L14 92 L14 84 L53 81 Q74 64 65 44 L53 41 Z" fill="#C6D2D7" stroke="#566F7B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M30 9 L45 15 L32 45 L19 39 Z" fill="#8FA6B2" stroke="#566F7B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="18" y="53" width="42" height="7" rx="2" fill="#91A7B2" stroke="#566F7B" stroke-width="1" /><circle cx="65" cy="53" r="8" fill="#E5ECEF" stroke="#566F7B" stroke-width="1.4" /></g>
<path id="edge-prepare" d="M317.8 372.5 L409 373 L520.92 373.5" fill="none" stroke="#354753" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-flow)"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#354753" font-weight="normal"><tspan x="349" y="330">prepare</tspan></text>
<path id="edge-observe" d="M680.08 373.5 L791 373 L883.84 366.5" fill="none" stroke="#354753" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-flow)"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#354753" font-weight="normal"><tspan x="744" y="330">observe</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="24" text-anchor="start" fill="#354753" font-weight="bold"><tspan x="128" y="207">1 Specimen</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="24" text-anchor="start" fill="#354753" font-weight="bold"><tspan x="470" y="207">2 Prepared slide</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="24" text-anchor="start" fill="#354753" font-weight="bold"><tspan x="866" y="207">3 Microscopy</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#354753" font-weight="normal"><tspan x="114" y="563">A defined material and an</tspan><tspan x="114" y="586.76">explicit identity</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#354753" font-weight="normal"><tspan x="477" y="563">Preparation is described in the</tspan><tspan x="477" y="586.76">study methods</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#354753" font-weight="normal"><tspan x="863" y="563">Observed data remain</tspan><tspan x="863" y="586.76">separate from illustration</tspan></text>
<path d="M50 700 H1150" fill="none" stroke="#CCD4D5" stroke-width="1"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#354753" font-weight="normal"><tspan x="50" y="734">Conceptual workflow; not an operating protocol. Sequence arrows indicate stages of work, not causal biological effects. No</tspan><tspan x="50" y="756.44">microscopy result or sample measurement is fabricated.</tspan></text>
</svg>
