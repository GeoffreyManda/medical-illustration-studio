<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="120mm" viewBox="0 0 1200 800" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Continuity of the nephron</title>
<desc id="figure-description">A simplified nephron map shows a renal corpuscle leading to a proximal tubule, a descending limb, the nephron loop, an ascending limb and a distal tubule. The distal route drains into an associated collecting duct. Cortex and medulla are indicated; vascular branches are omitted.</desc>
<rect width="1200" height="800" fill="#FFFFFF"/>
<defs><marker id="arrow-flow" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 -4 L9 0 L0 4 Z" fill="#354753"/></marker><marker id="arrow-activation" viewBox="0 -6 11 12" refX="10" refY="0" markerWidth="11" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 -5 L10 0 L1 5" fill="none" stroke="#354753" stroke-width="1.8"/></marker><marker id="arrow-inhibition" viewBox="-2 -8 5 16" refX="0" refY="0" markerWidth="5" markerHeight="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 -7 L0 7" stroke="#354753" stroke-width="2.2"/></marker></defs>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="34" text-anchor="start" fill="#354753" font-weight="bold"><tspan x="50" y="65">Continuity of the nephron</tspan></text>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#354753" font-weight="normal"><tspan x="50" y="100">The tubular route is unfolded to make its connections legible</tspan></text>
<rect id="compartment-cortex" x="50" y="146" width="1100" height="228" fill="#F7F0E7" stroke="none" stroke-width="1"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#354753" font-weight="normal"><tspan x="64" y="172">CORTEX</tspan></text>
<rect id="compartment-medulla" x="50" y="374" width="1100" height="310" fill="#F2F5F4" stroke="none" stroke-width="1"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#354753" font-weight="normal"><tspan x="64" y="400">MEDULLA</tspan></text>
<g id="node-nephron" transform="translate(567 428) rotate(0) scale(1.85 1.85) translate(-155 -140)"><ellipse cx="45" cy="41" rx="25" ry="25" fill="#F1D8C5" stroke="#9D7960" stroke-width="1.4" /><path d="M24 39 C44 15 62 37 47 50 C26 64 28 31 53 31 C72 42 53 60 34 52" fill="none" stroke="#BC7F75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M66 47 C97 67 76 12 104 23 C126 32 88 57 114 66 C141 75 140 27 155 37 C170 47 153 67 150 90 L150 212 C150 253 194 251 194 213 L194 99 C194 63 214 56 226 43 C242 28 210 17 205 35 C199 55 233 63 246 47 C261 31 277 53 262 67 L281 81" fill="none" stroke="#B78A54" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><path d="M66 47 C97 67 76 12 104 23 C126 32 88 57 114 66 C141 75 140 27 155 37 C170 47 153 67 150 90 L150 212 C150 253 194 251 194 213 L194 99 C194 63 214 56 226 43 C242 28 210 17 205 35 C199 55 233 63 246 47 C261 31 277 53 262 67 L281 81" fill="none" stroke="#F5E1C3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M286 26 L286 259" fill="none" stroke="#98734C" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" /><path d="M286 26 L286 259" fill="none" stroke="#E1C497" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></g>
<path d="M248 251 L363.5 244.85" fill="none" stroke="#61727B" stroke-width="1.05" stroke-linejoin="round"/><circle cx="363.5" cy="244.85" r="2.25" fill="#61727B"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#354753" font-weight="normal"><tspan x="67" y="259">Renal corpuscle</tspan></text>
<path d="M485.6 186 L485.6 283.7" fill="none" stroke="#61727B" stroke-width="1.05" stroke-linejoin="round"/><circle cx="485.6" cy="283.7" r="2.25" fill="#61727B"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#354753" font-weight="normal"><tspan x="391" y="170">Proximal tubule</tspan></text>
<path d="M741 178 L709.45 250.4" fill="none" stroke="#61727B" stroke-width="1.05" stroke-linejoin="round"/><circle cx="709.45" cy="250.4" r="2.25" fill="#61727B"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#354753" font-weight="normal"><tspan x="746" y="170">Distal tubule</tspan></text>
<path d="M266 485 L480 502 L557.75 465" fill="none" stroke="#61727B" stroke-width="1.05" stroke-linejoin="round"/><circle cx="557.75" cy="465" r="2.25" fill="#61727B"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#354753" font-weight="normal"><tspan x="76" y="493">Descending limb</tspan></text>
<path d="M888 479 L715 484 L639.15 465" fill="none" stroke="#61727B" stroke-width="1.05" stroke-linejoin="round"/><circle cx="639.15" cy="465" r="2.25" fill="#61727B"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#354753" font-weight="normal"><tspan x="893" y="487">Ascending limb</tspan></text>
<path d="M888 602 L809.35 500.15" fill="none" stroke="#61727B" stroke-width="1.05" stroke-linejoin="round"/><circle cx="809.35" cy="500.15" r="2.25" fill="#61727B"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#354753" font-weight="normal"><tspan x="893" y="610">Collecting duct</tspan></text>
<path d="M533 659 L602.15 614.85" fill="none" stroke="#61727B" stroke-width="1.05" stroke-linejoin="round"/><circle cx="602.15" cy="614.85" r="2.25" fill="#61727B"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="18" text-anchor="start" fill="#354753" font-weight="normal"><tspan x="354" y="667">Nephron loop</tspan></text>
<path d="M50 700 H1150" fill="none" stroke="#CCD4D5" stroke-width="1"/>
<text font-family="DejaVu Sans, Arial, sans-serif" font-size="17" text-anchor="start" fill="#354753" font-weight="normal"><tspan x="50" y="734">Unfolded schematic; not to scale. The collecting duct is associated drainage, not part of the nephron. Blood vessels and the</tspan><tspan x="50" y="756.44">filtration barrier are omitted.</tspan></text>
</svg>
