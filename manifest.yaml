name: medical-illustration-studio
scope: Extend the supplied medical illustration toolkit and unfinished atlas refinement
  with a functioning local agentic canvas, persistent projects, targeted change proposals,
  optional providers, source-linked anatomy contracts, editable lettering, controlled
  region editing, exports and agent tool access. Preserve original schematic workflows.
  No external accounts or user repositories are modified.
