delete: []

agentic_composer:
  authority: User request2November2026 to reuse Science Studio subscription engine and test live workflow.
  implementation: Existing agent.py, server.py, workspace.py and static studio sources.
  engine: ../science-studio/src/raso/rstudioHarness.py (runtime dependency, not copied).
  behaviour: Persistent conversation, artboard inspection and validated editing tools, iterative model calls, preview and explicit acceptance, cancellation.
  limits: Loopback only; credentials remain in Codex store; no host shell tools; four model calls per turn; no silent local fallback.
  verification: Existing test_agent.py and test_server.py plus actual live browser request.

creative_platform:
  authority: Principal2November2026 commissions unified Artcraft stack integration, simpler UI and application submission after refinement.
  implementation: medillustrate/graphics.py; existing workspace, agent, server, exports and static sources; tests/test_graphics.py.
  dependencies: vendor/artcraft/{photocraft,vectorcraft}/**; original pinned release engines, original notices and license texts.
  acquisition: Official upstream CLI and web release distributions; vendor size exception authorised by request to bring in entire editing stack.
  reader_surface: Artwork and concise editing conversation; technical traces remain in control exports.
  acceptance: Native pixel and vector engines render real edits; accepted native files persist; previews do not mutate source; stale changes fail; imports/exports roundtrip; actual subscription workflow tested; submit MIT only with truthful current capabilities.

flat_workspace:
  authority: User2November2026 requires tools at the app level rather than popovers.
  implementation: Existing static HTML, JS, CSS and generated studio-preview.html.
  acceptance: Permanent Canvas/Vector/Photo workspace tabs; editors occupy central work area, tool search in sidebar, composer remains accessible; native save-back retained; no editing-tools dialog.

visual_coherence:
  authority: User2November2026 reports inconsistent visual presentation.
  implementation: Existing static UI and standalone build.
  acceptance: Larger native canvas, one properties dock, optional artboard rail, quieter conversation, accurate proposal review on Canvas, readable controls and no redundant host status bar.

merged_workspace:
  authority: User2November2026 explicitly requires merge rather than embedded editors.
  implementation: Existing static HTML/JS/CSS, graphics.py and generated preview.
  behaviour: One shared viewport, host tool controls, native engine commands and same revision proposals; no iframe or upstream application chrome.
  acceptance: Real vector and pixel edits from integrated controls; native persistence, preview/accept/discard and engine command discovery preserved.
