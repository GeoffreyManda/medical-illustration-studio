<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medical Illustration Studio</title><link rel="stylesheet" href="/static/studio.css"></head>
<body>
<header class="app-header"><div class="wordmark">Medical Illustration <strong>Studio</strong></div><div class="project-name"><button id="project-picker" title="Switch project">Renal anatomy <span aria-hidden="true">⌄</span></button><span id="save-state" role="status">Saved locally</span></div><div class="header-actions"><button id="new-project">New project</button><button id="import-project">Open project</button><button id="artwork-import">Import artwork</button><button id="graphics-open">Editing tools</button><button id="export-open" class="primary">Export</button></div></header>
<main class="workspace">
<aside class="left-panel" aria-label="Project resources"><nav class="resource-tabs" aria-label="Resources"><button data-left="artboards" aria-selected="true">Artboards</button><button data-left="library">Library</button><button data-left="references">Sources</button></nav><div id="left-content"></div><button id="history-open" class="history-button">Revision history <span id="revision-count">1</span></button></aside>
<section class="canvas-workspace" aria-label="Illustration canvas"><nav class="workspace-tabs" aria-label="Editing tools"><button data-workspace="canvas" aria-selected="true">Anatomy</button><button data-workspace="vector">Draw</button><button data-workspace="photo">Adjust</button><span class="spacer"></span><span id="full-editor-status" role="status"></span><button id="boards-toggle" hidden></button><button id="editor-discard-switch" hidden></button><button id="editor-save" hidden></button></nav><div class="canvas-toolbar"><div class="tool-group"><button id="select-tool" class="active" title="Select and move labels (V)">Select</button><button id="region-tool" title="Select a painting region (R)">Region</button></div><div class="tool-group stage-control" aria-label="Drawing stage"><button data-stage="colour" class="active">Colour</button><button data-stage="values">Values</button><button data-stage="contours">Contours</button></div><label class="inline-label"><input type="checkbox" id="labels-visible" checked> Labels</label><div id="integrated-tools" class="integrated-tools" hidden></div><div class="spacer"></div><button id="fit-canvas">Fit</button><button id="zoom-out" aria-label="Zoom out">−</button><span id="zoom-label">60%</span><button id="zoom-in" aria-label="Zoom in">+</button></div><div class="preview-banner" id="preview-banner" hidden><span id="preview-text">Proposed revision</span><button id="close-preview">Back to current</button></div><div id="viewport" tabindex="0" aria-label="Scrollable drawing surface"><div id="canvas-wrap"><div id="paper"></div><div id="region-box" hidden></div></div></div><footer class="canvas-footer"><span id="canvas-description">Coronal illustrative section · Not to scale</span><span id="canvas-dimensions">190 mm · SVG</span></footer></section>
<aside class="right-panel" aria-label="Illustration editing"><nav class="editor-tabs"><button data-right="assistant" aria-selected="true">Assistant</button><button data-right="inspector">Inspector</button><button data-right="paint">Paint</button><button data-right="tools">Tools</button></nav><div id="right-content"></div></aside>
</main>
<div id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" aria-label="Close dialog">×</button></div><div id="modal-content"></div></dialog>
<input type="file" id="project-file" accept=".json,.zip" hidden>
<script src="/static/studio.js"></script>
</body></html>
